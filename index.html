<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="icaros-dev — desenvolvedor front-end. Projetos, contatos e redes.">
    <meta name="theme-color" content="#0b0d12">
    <title>icaros-dev | Links</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2338bdf8'/><text x='50' y='66' font-size='48' font-family='Arial' font-weight='700' text-anchor='middle' fill='%230b0d12'>IC</text></svg>">
    <style>
        :root {
            --bg: #0b0d12;
            --card: #141821;
            --card-hover: #1b2130;
            --border: #232a38;
            --text: #e8ecf3;
            --muted: #8b94a7;
            --accent: #38bdf8;
            --accent-2: #a78bfa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 0%, rgba(56, 189, 248, 0.14), transparent 40%),
                radial-gradient(circle at 90% 100%, rgba(167, 139, 250, 0.12), transparent 40%),
                var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            width: min(100% - 32px, 520px);
            margin: 0 auto;
            padding: 56px 0 40px;
        }

        /* ---------- Perfil ---------- */

        .profile {
            text-align: center;
            margin-bottom: 32px;
        }

        .avatar {
            width: 104px;
            height: 104px;
            margin: 0 auto 16px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }

        .avatar span {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--bg);
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .profile h1 {
            font-size: 1.5rem;
        }

        .profile h1 span {
            color: var(--accent);
        }

        .profile p {
            margin-top: 6px;
            color: var(--muted);
        }

        /* ---------- Links ---------- */

        .group-title {
            margin: 28px 0 12px;
            color: var(--muted);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .links {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 12px;
            list-style: none;
        }

        .link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .link:hover,
        .link:focus-visible {
            background: var(--card-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
            outline: none;
        }

        .link-icon {
            flex: none;
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #0f131b;
            border: 1px solid var(--border);
            font-size: 1.25rem;
        }

        .link-icon svg {
            width: 22px;
            height: 22px;
            fill: var(--text);
        }

        .link-text {
            flex: 1;
            min-width: 0;
        }

        .link-text strong {
            display: block;
        }

        .link-text small {
            display: block;
            color: var(--muted);
            font-size: 0.85rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .link-arrow {
            color: var(--muted);
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .link:hover .link-arrow {
            color: var(--accent);
            transform: translateX(3px);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: #5b6477;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <main class="page">

        <!-- ==================== PERFIL ==================== -->
        <header class="profile">
            <div class="avatar"><span>IC</span></div>
            <h1><span>@</span>icaros-dev</h1>
            <p>Desenvolvedor front-end • criando sites</p>
        </header>

        <!-- ==================== PROJETOS ==================== -->
        <h2 class="group-title">Projetos</h2>
        <ul class="links">
            <li>
                <a class="link" href="https://icaros-dev.github.io/parada-obrigatoria-site-2/" target="_blank" rel="noopener">
                    <span class="link-icon" aria-hidden="true">🍺</span>
                    <span class="link-text">
                        <strong>Parada Obrigatória</strong>
                        <small>Site do bar e petiscaria em Itabuna</small>
                    </span>
                    <span class="link-arrow" aria-hidden="true">→</span>
                </a>
            </li>
            <li>
                <a class="link" href="https://icaros-dev.github.io/verifica-eleicao/" target="_blank" rel="noopener">
                    <span class="link-icon" aria-hidden="true">🗳️</span>
                    <span class="link-text">
                        <strong>Verifica Eleição</strong>
                        <small>Checagem de notícias eleitorais</small>
                    </span>
                    <span class="link-arrow" aria-hidden="true">→</span>
                </a>
            </li>
        </ul>

        <!-- ==================== REDES E CONTATO ==================== -->
        <h2 class="group-title">Redes e contato</h2>
        <ul class="links">
            <li>
                <a class="link" href="https://github.com/icaros-dev" target="_blank" rel="noopener">
                    <span class="link-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.26 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
                    </span>
                    <span class="link-text">
                        <strong>GitHub</strong>
                        <small>github.com/icaros-dev</small>
                    </span>
                    <span class="link-arrow" aria-hidden="true">→</span>
                </a>
            </li>
        </ul>

        <footer>© <span id="ano">2026</span> icaros-dev</footer>
    </main>

    <script>
        document.getElementById('ano').textContent = new Date().getFullYear();
    </script>
</body>
</html>
